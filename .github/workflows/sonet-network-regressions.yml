name: Sonet Network Regression Tests
on:
  push:
    branches: [fix/youtube-403-investigation]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Exercise network recovery regressions
        run: timeout 300 bash ./gradlew :innertube:testDebugUnitTest --tests '*YouTubeRequestsTest*' --console=plain --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-regressions
          path: innertube/build/test-results/
