name: Onyx Midnight Release
on:
  push:
    branches: [feat/onyx-authkit-20261015]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: onyx-midnight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      METROLIST_APP_NAME: Onyx Music
      METROLIST_APPLICATION_ID: com.onyx.music
      METROLIST_BUILD_COMMIT: ${{ github.sha }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Regression tests and required debug build
        run: bash ./gradlew :app:testFossDebugUnitTest :innertube:testDebugUnitTest :app:assembleFossDebug --console=plain --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
      - name: Optimized release build
        run: bash ./gradlew :app:assembleIzzyRelease --console=plain --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: app/keystore/onyx-release.jks
          key: onyx-release-signing-v1
      - name: Sign and verify APK
        env:
          RELEASE_KEYSTORE: ${{ secrets.KEYSTORE }}
          RELEASE_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p app/keystore dist
          if [ -n "$RELEASE_KEYSTORE" ]; then
            printf '%s' "$RELEASE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/onyx-signing.jks"
            signing_file="$RUNNER_TEMP/onyx-signing.jks"
          else
            signing_file="app/keystore/onyx-release.jks"
            RELEASE_ALIAS=onyx
            RELEASE_STORE_PASSWORD=onyx-local-release
            RELEASE_KEY_PASSWORD=onyx-local-release
            export RELEASE_STORE_PASSWORD RELEASE_KEY_PASSWORD
            if [ ! -f "$signing_file" ]; then
              keytool -genkeypair -keystore "$signing_file" -storepass:env RELEASE_STORE_PASSWORD -keypass:env RELEASE_KEY_PASSWORD -alias "$RELEASE_ALIAS" -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Onyx Music,O=Onyx,C=MX" -noprompt
            fi
          fi
          apk_file="$(find app/build/outputs/apk/izzy/release -name '*-unsigned.apk' -print -quit)"
          test -n "$apk_file"
          tools_dir="$ANDROID_HOME/build-tools/36.0.0"
          "$tools_dir/zipalign" -p -f 4 "$apk_file" "$RUNNER_TEMP/onyx-aligned.apk"
          "$tools_dir/apksigner" sign --ks "$signing_file" --ks-key-alias "$RELEASE_ALIAS" --ks-pass env:RELEASE_STORE_PASSWORD --key-pass env:RELEASE_KEY_PASSWORD --out dist/Onyx-Music.apk "$RUNNER_TEMP/onyx-aligned.apk"
          "$tools_dir/apksigner" verify --verbose --print-certs dist/Onyx-Music.apk > dist/signature.txt
          "$tools_dir/aapt" dump badging dist/Onyx-Music.apk > dist/package.txt
          sha256sum dist/Onyx-Music.apk > dist/SHA256SUMS.txt
          cat dist/signature.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Onyx-Music-signed-release
          path: dist/*
          if-no-files-found: error
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="onyx-midnight-${GITHUB_SHA:0:7}"
          printf '%s\n' 'Onyx Music — Midnight' '' 'Optimized release APK, signed and verified with apksigner. Regression tests and FOSS debug build passed.' '' "Commit: $GITHUB_SHA" > "$RUNNER_TEMP/onyx-notes.md"
          gh release create "$tag" dist/Onyx-Music.apk dist/SHA256SUMS.txt dist/signature.txt dist/package.txt --target "$GITHUB_SHA" --title "Onyx Music · Midnight ${GITHUB_SHA:0:7}" --notes-file "$RUNNER_TEMP/onyx-notes.md" --prerelease --latest=false
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Onyx-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            innertube/build/reports/tests/
          if-no-files-found: ignore
