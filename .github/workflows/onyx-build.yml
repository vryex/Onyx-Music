name: Onyx Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - design/onyx-liquid-glass
      - feat/onyx-midnight

permissions:
  contents: read

concurrency:
  group: onyx-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore stable review signature
        id: signature
        uses: actions/cache@v4
        with:
          path: app/pr-debug.keystore
          key: pr-debug-keystore-2
      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.KEYSTORE }}
          SIGNING_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            printf '%s' "$SIGNING_KEY" | base64 --decode > app/onyx-release.keystore
            echo "METROLIST_DEBUG_KEYSTORE_PATH=onyx-release.keystore" >> "$GITHUB_ENV"
            echo "METROLIST_DEBUG_KEYSTORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "METROLIST_DEBUG_KEY_ALIAS=$SIGNING_ALIAS" >> "$GITHUB_ENV"
            echo "METROLIST_DEBUG_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            if [ ! -f app/pr-debug.keystore ]; then
              keytool -genkeypair -keystore app/pr-debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Onyx Music Review,O=Onyx,C=MX" -noprompt
            fi
            echo "METROLIST_DEBUG_KEYSTORE_PATH=pr-debug.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build and test
        env:
          METROLIST_APP_NAME: Onyx Music
          METROLIST_APPLICATION_ID: com.onyx.music
        run: ./gradlew :app:testFossDebugUnitTest :app:assembleFossDebug :app:assembleIzzyRelease --console=plain --max-workers=2 --stacktrace
      - name: Verify signature
        run: |
          mkdir -p delivery
          cp app/build/outputs/apk/izzy/release/*.apk delivery/Onyx-Music-Midnight.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs delivery/Onyx-Music-Midnight.apk > delivery/signature.txt
          sha256sum delivery/Onyx-Music-Midnight.apk > delivery/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Onyx-Music-Midnight-signed
          path: delivery/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Onyx-test-results
          path: app/build/test-results/
