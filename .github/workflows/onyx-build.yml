
name: Onyx Music APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar Onyx Music
        env:
          METROLIST_APP_NAME: Onyx Music
          METROLIST_APPLICATION_ID: com.onyx.music
        run: |
          bash ./gradlew :app:assembleIzzyDebug --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Onyx-Music-APK
          path: app/build/outputs/apk/izzy/debug/*.apk
          if-no-files-found: error
