
name: Sonet APK

on:
  workflow_dispatch:
  push:
    branches:
      - design/onyx-liquid-glass

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      
      - name: Instalar SDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi


      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      
      - name: Generar firma Android
        run: |
          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt


      - name: Compilar Sonet
        env:
          METROLIST_APP_NAME: Sonet
          METROLIST_APPLICATION_ID: com.onyx.music
        run: |
          bash ./gradlew :app:assembleIzzyDebug --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonet-APK
          path: app/build/outputs/apk/izzy/debug/*.apk
          if-no-files-found: error
