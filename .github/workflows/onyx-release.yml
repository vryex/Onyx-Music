name: Sonet Release APK

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar SDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x gradlew

      - name: Compilar Sonet Release
        env:
          METROLIST_APP_NAME: Sonet
          METROLIST_APPLICATION_ID: com.onyx.music
        run: |
          bash ./gradlew :app:assembleIzzyRelease --stacktrace

      - name: Firmar APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/izzy/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: Mover APK firmado
        run: |
          OUTPUT_DIR="app/build/outputs/apk/izzy/release"
          mkdir -p "$OUTPUT_DIR/out"
          find "$OUTPUT_DIR" -maxdepth 1 -name "*-signed.apk" -o -maxdepth 1 -name "*-unsigned-signed.apk" | xargs -I{} mv {} "$OUTPUT_DIR/out/"

      - name: Subir APK Release
        uses: actions/upload-artifact@v4
        with:
          name: Sonet-APK-Release
          path: app/build/outputs/apk/izzy/release/out/*
          if-no-files-found: error
