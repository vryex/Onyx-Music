name: Sonet Release APK

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar SDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x gradlew

      - name: Compilar Sonet Release
        env:
          METROLIST_APP_NAME: Sonet
          METROLIST_APPLICATION_ID: com.onyx.music
        run: |
          bash ./gradlew :app:assembleIzzyRelease --stacktrace

      - name: Generar llave de firma temporal
        run: |
          # Llave nueva en cada compilación (decisión de Brian 2026-11-08):
          # no hay secreto KEYSTORE en el repo, así que se genera una llave
          # temporal solo para firmar este APK. Cada compilación usa una
          # llave distinta, así que para actualizar habrá que desinstalar
          # la versión anterior primero.
          SONET_KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
          echo "SONET_KEYSTORE_PASSWORD=$SONET_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/sonet-release.keystore" \
            -alias sonet -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$SONET_KEYSTORE_PASSWORD" \
            -keypass "$SONET_KEYSTORE_PASSWORD" \
            -dname "CN=Sonet, O=Sonet"
          echo "SONET_KEYSTORE_B64=$(base64 -w0 "$GITHUB_WORKSPACE/sonet-release.keystore")" >> "$GITHUB_ENV"

      - name: Firmar APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/izzy/release/
          signingKey: ${{ env.SONET_KEYSTORE_B64 }}
          keyAlias: sonet
          keyStorePassword: ${{ env.SONET_KEYSTORE_PASSWORD }}
          keyPassword: ${{ env.SONET_KEYSTORE_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: Mover APK firmado
        run: |
          OUTPUT_DIR="app/build/outputs/apk/izzy/release"
          mkdir -p "$OUTPUT_DIR/out"
          find "$OUTPUT_DIR" -maxdepth 1 -name "*-signed.apk" -o -maxdepth 1 -name "*-unsigned-signed.apk" | xargs -I{} mv {} "$OUTPUT_DIR/out/"

      - name: Subir APK Release
        uses: actions/upload-artifact@v4
        with:
          name: Sonet-APK-Release
          path: app/build/outputs/apk/izzy/release/out/*
          if-no-files-found: error
