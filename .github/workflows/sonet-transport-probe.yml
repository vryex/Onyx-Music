name: Sonet Transport Probe Tests
on:
  push:
    branches: [fix/music-transport-probe]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"; fi
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew :innertube:testDebugUnitTest --tests '*MusicTransportProbeTest*' --console=plain --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
