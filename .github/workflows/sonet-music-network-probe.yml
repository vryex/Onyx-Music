name: Sonet Music Network Probe
on:
  push:
    branches: [debug/music-network-emulator]
permissions:
  contents: read
  actions: read
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile actual Music transport diagnostic
        run: bash ./gradlew :innertube:assembleDebugAndroidTest --console=plain --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            mkdir -p network-probe
            adb install -r innertube/build/outputs/apk/androidTest/debug/innertube-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w com.metrolist.innertube.test/com.metrolist.innertube.MusicNetworkProbe > network-probe/transport.txt
            cat network-probe/transport.txt
            adb logcat -d -s SonetNetworkProbe:I > network-probe/transport-logcat.txt
            grep -q 'PROBE_COMPLETE cases=11' network-probe/transport.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sonet-Music-transport-responses
          path: network-probe/
  installed-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Sonet-signed-release
          run-id: 39186350362
          github-token: ${{ github.token }}
          path: dist
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 .github/scripts/sonet_music_network_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sonet-Music-app-responses
          path: network-probe/
